<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedPilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="terminal">
    <div id="drag-region"></div>
    <div id="banner"></div>
    <div id="output"></div>
    <div id="input-area">
      <div class="prompt-line">
        <span class="prompt-user">┌──(</span><span class="prompt-name chrome-static">user@RedPilot</span><span class="prompt-user">)─[</span><span class="prompt-path">~</span><span class="prompt-user">]</span>
      </div>
      <div class="input-row">
        <span class="prompt-arrow">└─$ </span>
        <input type="text" id="cmd" spellcheck="false" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
